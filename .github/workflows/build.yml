name: Build

# Installers on demand, without publishing anything. The packages land as artifacts on the run,
# which is what makes a fix testable before it is released.
on: workflow_dispatch

jobs:
  build:
    name: Installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            artifact: windows
          - label: macOS (Apple silicon)
            os: macos-latest
            artifact: macos-aarch64
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: toglet-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
